<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 style="display: flex; justify-content: center; align-items: center; font-family: Arial, sans-serif; font-size: 3em;">Whack-a-mole</h1>

    <div id="topBar">

    <div style="display: inline-block; font-family: Arial, sans-serif;">
        <h2 id="score"></h2>
    </div>

    <div style="display: inline-block; font-family: Arial, sans-serif;">
        <h2 id="time-left"></h2>
    </div>

    </div>

    <nav href="#controls"></nav> 

    <button id="start">Start</button>
    
    
    
    <div id="game">
        
        <section id="controls">
            <button id="pause">Pause</button><br>
            <button id="resume">Resume</button><br>
            <button id="reStart">Restart</button>
        </section>

        <div class="grid">
            <div class="square" id="1"></div>
            <div class="square" id="2"></div>
            <div class="square" id="3"></div> 
            <div class="square" id="4"></div>
            <div class="square" id="5"></div>
            <div class="square" id="6"></div>
            <div class="square" id="7"></div>
            <div class="square" id="8"></div>
            <div class="square" id="9"></div>
        </div>

    </div>
    
</body>
<script src="alternative.js"></script>
</html>
